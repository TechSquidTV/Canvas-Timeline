packages:
  - 'apps/*'
  - 'packages/*'
  - 'scripts'
# Vite+ selects the pinned pnpm version; omit pnpm's separate environment document
# so GitHub's dependency graph can read the resolved project dependencies.
# https://github.com/dependabot/dependabot-core/issues/15904
pmOnFail: ignore
onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  '@sentry/cli': false
  esbuild: true
  sharp: true
  workerd: true
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11
  vite-plus: 0.3.3
  '@vitest/coverage-v8': 4.1.11
overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
  sharp: ^0.35.5
  svgo: ^4.0.2
  http-cache-semantics@4: ^4.3.0
  undici@7: ^8.0.0
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@0.2.2'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.2.2'
  - '@voidzero-dev/vite-plus-darwin-x64@0.2.2'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.2'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.2.2'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.2.2'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.2.2'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.2'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.2.2'
  - vite-plus@0.2.2
  - '@astrojs/cloudflare@14.1.1'
  - '@astrojs/internal-helpers@0.10.1'
  - '@astrojs/markdown-remark@7.2.1'
  - '@astrojs/markdown-satteri@0.3.3'
  - '@astrojs/mdx@7.0.2'
  - '@astrojs/react@6.0.1'
  - astro@7.0.6
  - '@cloudflare/workerd-darwin-64@1.20260702.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260702.1'
  - '@cloudflare/workerd-linux-64@1.20260702.1'
  - '@cloudflare/workerd-linux-arm64@1.20260702.1'
  - '@cloudflare/workerd-windows-64@1.20260702.1'
  - miniflare@4.20260701.0
  - workerd@1.20260702.1
  - wrangler@4.107.0
  - mediabunny@1.56.0
  # GHSA-ch52-4w7c-c8xp: allow the published security fix immediately.
  - http-cache-semantics@4.3.0
  # GHSA-wq5f-xc86-pv6w and GHSA-68fv-2mgg-jv7q: allow these security fixes immediately.
  - sharp@0.35.5
  - source-map-js@1.2.2
